name: Single-instance FreeBSD proof

on:
  push:
    branches: [proof/single-instance-freebsd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: db4a92ed9450dbba76b4fbfda5af0c20ab25e32b
          persist-credentials: false
      - name: Install native dependencies
        run: |
          test "$(git rev-parse HEAD)" = db4a92ed9450dbba76b4fbfda5af0c20ab25e32b
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev dbus
          rustup toolchain install stable --profile minimal
          rustc +stable --version
          cargo +stable --version
          dbus-daemon --version
      - name: Test the single-instance crate
        run: cargo +stable test --locked --package tauri-plugin-single-instance --all-targets --features deep-link
      - name: Verify D-Bus handoff and ownership release
        run: |
          timeout -k 5s 90s dbus-run-session -- cargo +stable test --locked \
            --package tauri-plugin-single-instance --features deep-link --test dbus \
            -- --ignored --exact dbus_handoff_and_release --test-threads=1 --nocapture

  freebsd:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: db4a92ed9450dbba76b4fbfda5af0c20ab25e32b
          persist-credentials: false
      - name: Verify candidate source
        run: test "$(git rev-parse HEAD)" = db4a92ed9450dbba76b4fbfda5af0c20ab25e32b
      - name: Test on native FreeBSD
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y rust git pkgconf gtk3 webkit2-gtk_41 dbus
          run: |
            set -eu
            # rsync preserves the host owner; trust only this verified checkout.
            test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = db4a92ed9450dbba76b4fbfda5af0c20ab25e32b
            freebsd-version
            rustc --version
            cargo --version
            dbus-daemon --version
            pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
            cargo test --locked --package tauri-plugin-single-instance --all-targets --features deep-link
            timeout -k 5s 90s dbus-run-session -- cargo test --locked \
              --package tauri-plugin-single-instance --features deep-link --test dbus \
              -- --ignored --exact dbus_handoff_and_release --test-threads=1 --nocapture
