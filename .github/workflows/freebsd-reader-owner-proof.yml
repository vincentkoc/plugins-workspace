name: Temporary FreeBSD sealed process identity proof
on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-reader-owner-proof.yml]
permissions:
  contents: read
jobs:
  reader:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480
        with:
          release: '15.1'
          arch: ${{ matrix.arch }}
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 ca_root_nss
          run: |
            set -eu
            freebsd-version
            test "$(uname -s)" = FreeBSD
            case "$(uname -m)" in amd64|arm64) ;; *) exit 1 ;; esac
            node --version
            npm --version
            work=$(mktemp -d /tmp/openclaw-reader-owner.XXXXXX)
            trap 'rm -f "$work/runtime.mjs.gz" "$work/managed-handoff-runtime.mjs" "$work/driver.sh"; rmdir "$work"' EXIT
            trap 'exit 1' HUP INT TERM
            timeout -k 5s 30s fetch -q -o "$work/runtime.mjs.gz" "https://raw.githubusercontent.com/vincentkoc/plugins-workspace/${{ github.sha }}/.github/freebsd-proof/reader-d0345f14-runtime.mjs.gz"
            test "$(stat -f %z "$work/runtime.mjs.gz")" = 389140
            test "$(sha256 -q "$work/runtime.mjs.gz")" = 61dc67f5446370f49ee1510e610046607772abbde7e78d7ac76597cd5395902a
            gzip -dc "$work/runtime.mjs.gz" > "$work/managed-handoff-runtime.mjs"
            test "$(stat -f %z "$work/managed-handoff-runtime.mjs")" = 2030744
            test "$(sha256 -q "$work/managed-handoff-runtime.mjs")" = 87711e45c1dc5db0e625d0a5bc8d7f29a90a307cceab1439ab9d02b983a7df37
            cat <<'DRIVER_GZIP_BASE64' | base64 -d | gzip -dc > "$work/driver.sh"
