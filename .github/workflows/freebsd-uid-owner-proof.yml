name: Temporary FreeBSD credential owner proof
on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-uid-owner-proof.yml]
permissions:
  contents: read
jobs:
  owner:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480
        with:
          release: '15.1'
          arch: x86_64
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y rust git pkgconf gtk3 webkit2-gtk_41 bash python311 ca_root_nss
          run: |
            set -eu
            freebsd-version
            work=$(mktemp -d /tmp/openclaw-uid-driver.XXXXXX)
            trap 'rm -f "$work/driver.sh"; rmdir "$work"' EXIT
            trap 'exit 1' HUP INT TERM
