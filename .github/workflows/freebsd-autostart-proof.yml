name: Temporary FreeBSD autostart composition proof

on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-autostart-proof.yml]

permissions:
  contents: read

concurrency:
  group: temporary-freebsd-autostart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freebsd:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vincentkoc/plugins-workspace
          ref: 748cc3632f4f8847ac04bcbd2752a78c12e1a0b6
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = '748cc3632f4f8847ac04bcbd2752a78c12e1a0b6'
          test "$(git rev-parse HEAD^)" = 'f11740c97c32c120da89302bff94b0018b0bb8b5'
          test "$(git diff --name-only HEAD^ HEAD)" = Cargo.lock
          test "$(git show HEAD^:Cargo.lock | sha256sum | cut -d ' ' -f1)" = b069b475db038fcacfd5578da766a60bd4e99e70faa78779215bf4716ebd8c78
      - name: Test on native FreeBSD
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y rust git pkgconf gtk3 webkit2-gtk_41
          run: |
            set -eu
            test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '748cc3632f4f8847ac04bcbd2752a78c12e1a0b6'
            freebsd-version
            rustc --version
            cargo --version
            pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
            test "$(sha256 -q Cargo.lock)" = 0a2d9dbd4f90e0956e692fa267cdd62eef0507db0f9d2ef29957e421d5e9710e
            echo 'DEVELOPMENT COMPOSITION: f11740c9 with unpublished canonical auto-launch 5a77b66; product lock unchanged'
            composed_cargo() {
              cargo --config 'patch.crates-io.auto-launch.git="https://github.com/zzzgydi/auto-launch.git"' \
                --config 'patch.crates-io.auto-launch.rev="5a77b66cfb745e2ead928fe37aedee828cb993ea"' "$@"
            }
            selected=$(composed_cargo tree --locked -p tauri-plugin-autostart --target x86_64-unknown-freebsd -i auto-launch@0.6.0)
            printf '%s\n' "$selected"
            printf '%s\n' "$selected" | grep -F '5a77b66cfb745e2ead928fe37aedee828cb993ea'
            composed_cargo test --locked -p tauri-plugin-autostart --lib --test xdg
            test "$(sha256 -q Cargo.lock)" = 0a2d9dbd4f90e0956e692fa267cdd62eef0507db0f9d2ef29957e421d5e9710e
            git -c safe.directory="$PWD" diff --exit-code HEAD --
