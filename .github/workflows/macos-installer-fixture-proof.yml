name: Temporary macOS installer fixture proof
on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/macos-installer-fixture-proof.yml]
permissions:
  contents: read
jobs:
  installer:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openclaw/openclaw
          ref: 8e865b56d93c91b07b7953ba681f3df5df37ae32
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8e865b56d93c91b07b7953ba681f3df5df37ae32
          test -z "$(git status --porcelain)"
          git cat-file -e '24480988b8a0dbed8938a2da65ff3f56e1012d4b^{commit}'
      - name: Install the exact source dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.x'
          install-bun: 'false'
          frozen-lockfile: 'true'
          cache-mode: 'off'
      - name: Reproduce Homebrew Bash refusal and verify repaired fixtures
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          brew install bash
          brew_bash_prefix=$(brew --prefix bash)
          export PATH="$brew_bash_prefix/bin:$PATH"
          driver=$(mktemp /tmp/openclaw-macos-installer-driver.XXXXXX)
          trap 'rm -f "$driver"' EXIT
          trap 'exit 1' HUP INT TERM
