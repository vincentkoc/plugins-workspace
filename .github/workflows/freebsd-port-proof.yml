name: Temporary FreeBSD port proofs

on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-port-proof.yml]

permissions:
  contents: read

jobs:
  helper-archive:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reproduce the native helper archive mismatch
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 jq
          run: |
            set -eu
            driver=$(mktemp /tmp/freebsd-helper-proof.XXXXXX)
            trap 'rm -f "$driver"' EXIT
            trap 'exit 1' HUP INT TERM
            cat > "$driver" <<'DRIVER'
            #!/bin/sh
            # Disposable native reproduction of the Ports fetch helper's two archive paths.
            set -eu
            [ "$(uname -s)" = FreeBSD ]
            for command in node npm jq fetch timeout; do command -v "$command" >/dev/null; done
            work=$(mktemp -d /tmp/npmjs-archive-proof.XXXXXX)
            cleanup() {
              result=$?
              trap - EXIT HUP INT TERM
              rm -rf "$work"
              exit "$result"
            }
            trap cleanup EXIT
            trap 'exit 1' HUP INT TERM
            mkdir "$work/tmp" "$work/home" "$work/first" "$work/second"
            export TMPDIR="$work/tmp" HOME="$work/home" LOCALBASE=/usr/local
            # npm rejects one source path loaded as both user and global configuration.
            : > "$work/npm-user.conf"
            : > "$work/npm-global.conf"
            export npm_config_userconfig="$work/npm-user.conf"
            export npm_config_globalconfig="$work/npm-global.conf"
            export npm_config_cache="$work/cache" npm_config_ignore_scripts=true
            export npm_config_audit=false npm_config_fund=false
            # Keep the helper and package fixed; is-number has no runtime dependencies/hooks.
            timeout 60 fetch -q -o "$work/helper.sh" \
              https://raw.githubusercontent.com/freebsd/freebsd-ports/2cb2680d95459f1a2d484151ef8c70d37460f15c/Tools/scripts/npmjs-fetch-with-dependencies.sh
            [ "$(sha256 -q "$work/helper.sh")" = 1a7b0b2cb656a2ea80b49f68e0a4b5e39f519a72065ba5206c8b706c072c21a4 ]
            node --version
            npm --version
            timeout -k 5 120 /bin/sh "$work/helper.sh" is-number 7.0.0 "$work/package-lock.json" "$work/first.tgz"
            node - "$work/package-lock.json" <<'JS'
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const lock = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            assert.deepEqual(Object.keys(lock.packages).sort(), ['', 'node_modules/is-number']);
            const pkg = lock.packages['node_modules/is-number'];
            assert.equal(pkg.version, '7.0.0');
            assert.equal(pkg.resolved, 'https://registry.npmjs.org/is-number/-/is-number-7.0.0.tgz');
            assert.equal(pkg.integrity, 'sha512-41Cifkg6e8TylSpdtTpeLVMqvSBEVzTttHvERD741+pnZ8ANv0004MRL43QKPDlK9cGvNp6NZWZUBlbGXYxxng==');
            JS
            lock_hash=$(sha256 -q "$work/package-lock.json")
            timeout -k 5 120 /bin/sh "$work/helper.sh" is-number 7.0.0 "$work/package-lock.json" "$work/second.tgz"
            [ "$(sha256 -q "$work/package-lock.json")" = "$lock_hash" ]
            first_hash=$(sha256 -q "$work/first.tgz")
            second_hash=$(sha256 -q "$work/second.tgz")
            [ "$first_hash" != "$second_hash" ]
            tar -xzf "$work/first.tgz" -C "$work/first"
            tar -xzf "$work/second.tgz" -C "$work/second"
            node - "$work/first/is-number-7.0.0" "$work/second/is-number-7.0.0" <<'JS'
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const assert = require('node:assert/strict');
            function entries(root) {
              const result = {};
              function walk(rel) {
                const absolute = path.join(root, rel);
                const st = fs.lstatSync(absolute);
                result[rel] = [st.mode, st.uid, st.gid, st.mtimeMs,
                  st.isSymbolicLink() ? fs.readlinkSync(absolute) : st.isFile() ? crypto.createHash('sha256').update(fs.readFileSync(absolute)).digest('hex') : null];
                if (st.isDirectory()) for (const name of fs.readdirSync(absolute).sort()) walk(path.join(rel, name));
              }
              walk('');
              return result;
            }
            const first = entries(process.argv[2]), second = entries(process.argv[3]);
            assert.deepEqual(Object.keys(first), Object.keys(second));
            const changed = Object.keys(first).filter(name => JSON.stringify(first[name]) !== JSON.stringify(second[name]));
            assert.deepEqual(changed, ['package.json']);
            for (const root of process.argv.slice(2)) console.log(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
            console.log('PASS only installer package.json differs between generated-lock and committed-lock archives');
            JS
            printf 'first SHA256=%s\nsecond SHA256=%s\n' "$first_hash" "$second_hash"
            echo 'PASS native archive mismatch reproduced; no helper fix or cross-platform claim'
            DRIVER
            test "$(sha256 -q "$driver")" = '6b8b9f68f76021a3b6ea01827e0ae7f3d4008a7384efc190d47ec8acf1cd5126'
            timeout -k 15s 300s sh "$driver"
