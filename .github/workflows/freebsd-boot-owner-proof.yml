name: Temporary FreeBSD boot identity owner proof
on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-boot-owner-proof.yml]
permissions:
  contents: read
jobs:
  owner:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480
        with:
          release: '15.1'
          arch: x86_64
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 ca_root_nss
          run: |
            set -eu
            freebsd-version
            test "$(uname -s)" = FreeBSD
            test "$(uname -m)" = amd64
            node --version
            work=$(mktemp -d /tmp/openclaw-boot-owner.XXXXXX)
            trap 'rm -f "$work/runtime.mjs.gz" "$work/managed-handoff-runtime.mjs" "$work/driver.mjs"; rmdir "$work"' EXIT
            trap 'exit 1' HUP INT TERM
            timeout -k 5s 30s fetch -q -o "$work/runtime.mjs.gz" "https://raw.githubusercontent.com/vincentkoc/plugins-workspace/${{ github.sha }}/.github/freebsd-proof/boot-8c0f0df6-runtime.mjs.gz"
            test "$(stat -f %z "$work/runtime.mjs.gz")" = 388274
            test "$(sha256 -q "$work/runtime.mjs.gz")" = f4e15b3d1e2cf665e1340fdfd855c092a9183562fcd1e2adbdf2d975e2d3f84a
            gzip -dc "$work/runtime.mjs.gz" > "$work/managed-handoff-runtime.mjs"
            test "$(stat -f %z "$work/managed-handoff-runtime.mjs")" = 2028072
            test "$(sha256 -q "$work/managed-handoff-runtime.mjs")" = e1e864a077e280334f01ea06596dd05242d4e0ed545661a69186b1dc3469520b
            cat <<'DRIVER_BASE64' | base64 -d > "$work/driver.mjs"
