name: Temporary FreeBSD runtime path proof
on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-runtime-path-proof.yml]
permissions:
  contents: read
jobs:
  runtime-path:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify generated launcher and service dependency paths
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: '15.1'
          arch: x86_64
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 python3 ca_root_nss
          run: |
            set -eu
            freebsd-version
            node --version
            work=$(mktemp -d /tmp/freebsd-runtime-framework.XXXXXX)
            trap 'rm -rf "$work"' EXIT
            trap 'exit 1' HUP INT TERM
            ports_sha=2cb2680d95459f1a2d484151ef8c70d37460f15c
            mkdir "$work/ports"
            timeout -k 15s 180s fetch -q -o "$work/ports.tgz" "https://codeload.github.com/freebsd/freebsd-ports/tar.gz/$ports_sha"
            test "$(stat -f %z "$work/ports.tgz")" -lt 536870912
            tar -xzf "$work/ports.tgz" --strip-components 1 -C "$work/ports"               "freebsd-ports-$ports_sha/Mk" "freebsd-ports-$ports_sha/Tools"               "freebsd-ports-$ports_sha/Templates" "freebsd-ports-$ports_sha/Keywords"               "freebsd-ports-$ports_sha/lang/python312/Makefile.version"
            rm "$work/ports.tgz"
            cat <<'DRIVER_BASE64' | base64 -d > "$work/driver.sh"
            IyEvYmluL3NoCiMgUnVuIGFnYWluc3QgYW4gZXhhY3Qgb2ZmaWNpYWwgUG9ydHMgZnJhbWV3b3JrIGluIGEgZGlzcG9zYWJsZSBG
