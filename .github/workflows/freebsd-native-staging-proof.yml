name: Temporary FreeBSD native staging proof
on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-native-staging-proof.yml]
permissions:
  contents: read
jobs:
  staging:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480
        with:
          release: '15.1'
          arch: ${{ matrix.arch }}
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 cmake-core ninja ca_root_nss
          run: |
            set -eu
            freebsd-version
            node --version
            npm --version
            work=$(mktemp -d /tmp/openclaw-native-staging-driver.XXXXXX)
            trap 'rm -f "$work/driver.sh"; rmdir "$work"' EXIT
            trap 'exit 1' HUP INT TERM
            cat <<'DRIVER_BASE64' | base64 -d > "$work/driver.sh"
