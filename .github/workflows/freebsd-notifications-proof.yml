name: Temporary FreeBSD notification proofs

on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-notifications-proof.yml]

permissions:
  contents: read

jobs:
  notifications:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source:
          - 23d24eb79fe115d39ba0ca5d273488840ae20465
          - 00c312f4cfb72cf9c8d3e6fff840ffcb419ece81
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vincentkoc/tauri-plugin-notifications
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Verify candidate source
        run: test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
      - name: Verify native notification lifecycle
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y rust git pkgconf gtk3 webkit2-gtk_41 dbus
          run: |
            set -eu
            test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '${{ matrix.source }}'
            freebsd-version
            rustc --version
            cargo --version
            pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
            # These library repositories do not commit Cargo.lock. Resolve once,
            # record it, then keep identical versions across feature variants.
            cargo generate-lockfile
            sha256 Cargo.lock
            cargo tree --locked --depth 1
            cargo test --locked --lib
            cargo test --locked --lib --no-default-features
            timeout -k 5s 180s dbus-run-session -- cargo test --locked --test xdg_lifecycle -- --ignored --exact shows_tracks_and_closes_notifications --nocapture
            timeout -k 5s 180s dbus-run-session -- cargo test --locked --no-default-features --test xdg_lifecycle -- --ignored --exact shows_tracks_and_closes_notifications --nocapture
