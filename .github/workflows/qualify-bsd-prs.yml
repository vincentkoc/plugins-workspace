name: Qualify FreeBSD PR resolutions
on:
  push:
    branches: [proof/nov25-bsd-pr-validation]
    paths: [.github/workflows/qualify-bsd-prs.yml]
permissions:
  contents: read
jobs:
  component:
    if: github.repository == 'vincentkoc/plugins-workspace' && github.actor == 'vincentkoc'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [linux, freebsd]
        component: [single-instance, updater, deep-link, resource-dir]
        include:
          - component: single-instance
            repo: vincentkoc/plugins-workspace
            sha: 9398928eb2deff264577b93131c53d23750dac15
          - component: updater
            repo: vincentkoc/plugins-workspace
            sha: ff86e269ce96d319d001afcc83cf48c5d6afb2d5
          - component: deep-link
            repo: vincentkoc/plugins-workspace
            sha: 77853ec2b8f1ec1c4ec903b5c33256c3773968ad
          - component: resource-dir
            repo: vincentkoc/tauri
            sha: 0109a62407adba4f64c2e956d14cd9180d1ddef3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - name: Prepare component test
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          cat > qualify.sh <<'SH'
          #!/bin/sh
          set -eu
          cd source
          export CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 CARGO_TERM_COLOR=never
          uname -sm
          rustc --version
          cargo --version
          run_test() {
            expected=$1
            shift
            log=$(mktemp)
            if ! "$@" > "$log" 2>&1; then tail -200 "$log"; rm "$log"; exit 1; fi
            tail -35 "$log"
            grep -E "^test (.*/|.*::)?${expected} \.\.\. ok$" "$log"
            rm "$log"
          }
          case "$1" in
            single-instance)
              run_test dbus_handoff_and_release dbus-run-session -- cargo test --locked -p tauri-plugin-single-instance --features deep-link --test dbus -- --ignored --exact dbus_handoff_and_release --test-threads=1
              ;;
            deep-link)
              command -v xdg-mime
              command -v update-desktop-database
              run_test xdg_unregister cargo test --locked -p tauri-plugin-deep-link --test xdg_unregister
              run_test xdg_command_results cargo test --locked -p tauri-plugin-deep-link --test xdg_commands
              ;;
            updater)
              run_test custom_target_checks_metadata_without_installing cargo test --locked -p tauri-plugin-updater --test bsd
              run_test verifies_cached_bytes_and_rejects_tampering cargo test --locked -p tauri-plugin-updater --lib verifies_cached_bytes_and_rejects_tampering
              ;;
            resource-dir)
              expected=resolve_resource_dir
              if [ "$(uname -s)" = FreeBSD ]; then expected=resolve_installed_freebsd_resource_dir; fi
              run_test "$expected" cargo test --locked -p tauri-utils --lib platform::tests
              ;;
          esac
          SH
      - name: Linux component test
        if: matrix.platform == 'linux'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config dbus xdg-utils desktop-file-utils
          sh qualify.sh "$COMPONENT"
      - name: FreeBSD component test
        if: matrix.platform == 'freebsd'
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480
        env:
          COMPONENT: ${{ matrix.component }}
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: COMPONENT
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg install -y rust git pkgconf gtk3 webkit2-gtk_41 dbus xdg-utils desktop-file-utils
          run: sh qualify.sh "$COMPONENT"
