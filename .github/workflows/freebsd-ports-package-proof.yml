name: Temporary FreeBSD Ports package proof

on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-ports-package-proof.yml]

permissions:
  contents: read

concurrency:
  group: temporary-freebsd-ports-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build and verify the Ports package
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: '15.1'
          arch: x86_64
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 python3 gmake cmake-core jq curl ca_root_nss
          run: |
            set -eu
            freebsd-version
            node --version
            npm --version
            df -h . /tmp
            sysctl hw.physmem
            driver=$(mktemp /tmp/freebsd-ports-package-driver.XXXXXX)
            trap 'rm -f "$driver"' EXIT
            trap 'exit 1' HUP INT TERM
            cat > "$driver" <<'DRIVER'
            #!/bin/sh
            # Disposable FreeBSD Ports stage/package proof; no package install or service activation.
            set -eu
            [ "$(uname -s)" = FreeBSD ]
            [ "$(id -u)" = 0 ]
            output=${1:?absolute new export directory required}
            case "$output" in /*) ;; *) exit 1 ;; esac
            [ ! -e "$output" ]
            for command in node npm python3 gmake cmake jq fetch mdconfig newfs mount umount timeout pkg tar make curl; do
              command -v "$command" >/dev/null
            done
            node -e 'const [a,b]=process.versions.node.split(".").map(Number); if(a!==24||b<16) process.exit(1)'
            work=$(mktemp -d /tmp/openclaw-ports-package.XXXXXX)
            device=
            mounted=no
            owned_device() {
              # Unit queries avoid the trailing separator emitted by list mode.
              reported_device=$(mdconfig -l -u "$device" -f "$work/scratch.img") || return 1
              [ "$reported_device" = "$device" ]
            }
            owned_mount() {
              mount -p | awk -v source="/dev/$device" -v target="$work/scratch" \
                '$1 == source && $2 == target && $3 == "ufs" { found++ } END { exit(found != 1) }'
            }
            cleanup() {
              result=$?
              trap - EXIT HUP INT TERM
              if [ -n "$device" ] && ! owned_device; then
                echo "cleanup ownership mismatch; retained $work" >&2
                exit 1
              fi
              if [ "$mounted" = yes ]; then
                if ! owned_mount; then
                  echo "cleanup mount ownership mismatch; retained $work" >&2
                  exit 1
                fi
                if ! umount "$work/scratch"; then
                  echo "cleanup failed; retained owned mount $work/scratch" >&2
                  exit 1
                fi
              fi
              if [ -n "$device" ]; then
                if ! mdconfig -d -u "$device"; then
                  echo "cleanup failed; retained owned device $device" >&2
                  exit 1
                fi
              fi
              rm -rf "$work"
              exit "$result"
            }
            trap cleanup EXIT
            trap 'exit 1' HUP INT TERM
            available_kib=$(df -k "$work" | awk 'NR == 2 { print $4 }')
            [ "$available_kib" -ge 7340032 ]
            [ "$(sysctl -n hw.physmem)" -ge 4294967296 ]
            # A dedicated filesystem enforces the scratch limit across npm and native builds.
            truncate -s 6G "$work/scratch.img"
            device=$(mdconfig -a -t vnode -f "$work/scratch.img")
            case "$device" in md[0-9]*) ;; *) echo 'invalid owned md device' >&2; exit 1 ;; esac
            case "${device#md}" in ''|*[!0-9]*) exit 1 ;; esac
            owned_device
            newfs -U "/dev/$device" >/dev/null
            mkdir "$work/scratch"
            mount "/dev/$device" "$work/scratch"
            mounted=yes
            owned_mount
            mkdir "$work/scratch/home" "$work/scratch/tmp" "$work/scratch/export"
            export HOME="$work/scratch/home" TMPDIR="$work/scratch/tmp"
            # npm rejects one source path loaded as both user and global configuration.
            : > "$work/scratch/npm-user.conf"
            : > "$work/scratch/npm-global.conf"
            export npm_config_userconfig="$work/scratch/npm-user.conf"
            export npm_config_globalconfig="$work/scratch/npm-global.conf"
            export npm_config_cache="$work/scratch/npm-cache"
            export npm_config_force=true npm_config_audit=false npm_config_fund=false
            export LOCALBASE=/usr/local PYTHON=/usr/local/bin/python3
            export CMAKE_BUILD_PARALLEL_LEVEL=2
            unset MAKEFLAGS
            cat > "$work/package.sh" <<'SH'
            #!/bin/sh
            set -eu
            work=$1
            root="$work/scratch"
            ports_sha=2cb2680d95459f1a2d484151ef8c70d37460f15c
            candidate=78150fbeaef818c641bd84095db84eae9a0753e5
            [ ! -e /usr/local/bin/openclaw ]
            [ ! -e /usr/local/etc/rc.d/openclaw ]
            pkg info -e 'node24>=24.16.0'
            pkg info -e 'npm-node24>=0'
            mkdir "$root/ports" "$root/packages"
            # Read the official framework, tools and required Python version include.
            timeout 180 fetch -q -o "$root/ports.tgz" \
              "https://codeload.github.com/freebsd/freebsd-ports/tar.gz/$ports_sha"
            [ "$(stat -f %z "$root/ports.tgz")" -lt 536870912 ]
            tar -xzf "$root/ports.tgz" --strip-components 1 -C "$root/ports" \
              "freebsd-ports-$ports_sha/Mk" "freebsd-ports-$ports_sha/Tools" \
              "freebsd-ports-$ports_sha/Templates" "freebsd-ports-$ports_sha/Keywords" \
              "freebsd-ports-$ports_sha/lang/python312/Makefile.version"
            rm "$root/ports.tgz"
            [ "$(sha256 -q "$root/ports/Tools/scripts/npmjs-fetch-with-dependencies.sh")" = 1a7b0b2cb656a2ea80b49f68e0a4b5e39f519a72065ba5206c8b706c072c21a4 ]
            port="$root/ports/misc/openclaw"
            mkdir -p "$port/files"
            fetch_source() {
              name=$1
              digest=$2
              timeout 60 fetch -q -o "$port/$name" \
                "https://raw.githubusercontent.com/vincentkoc/freebsd-ports/$candidate/misc/openclaw/$name"
              [ "$(sha256 -q "$port/$name")" = "$digest" ]
            }
            fetch_source Makefile 775b023e9e5b7fd47b1a47124eadac83b7508521a955f7c75f7408c639915bae
            fetch_source distinfo 3a70d9700eddbc53451183c99dfee96a452c5c33964e342a83ae33a1eb97aed0
            fetch_source pkg-descr 5482288d3bca58670b2da1faf81b7ba58833c8c9e413d26da69049c4b0c31e9e
            fetch_source pkg-message 5ca521c636cfc717bddff290790d80454d0900fa406e97286465f493e2ebc49e
            fetch_source files/openclaw.in 4d23ab3573030234fcc309cc0e35c3e2412d27c0e2b0fb13661ffe95c4333aeb
            fetch_source files/package-lock.json e3000d2eafa2386649f53ccae48377cf2c9abedc41bd0383cbca6c0007c60e7a
            port_make() {
              make -C "$port" PORTSDIR="$root/ports" WRKDIRPREFIX="$root/work" \
                DISTDIR="$root/dist" PACKAGES="$root/packages" BATCH=yes \
                OPTIONS_UNSET=SKILL_DEPENDENCIES MAKE_JOBS_NUMBER=2 "$@"
            }
            port_make -V FETCH_DEPENDS -V BUILD_DEPENDS -V RUN_DEPENDS > "$root/dependencies.txt"
            node - "$root/dependencies.txt" <<'JS'
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const lines = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').map(line => line.trim().split(/\s+/));
            assert.equal(lines.length, 3);
            for (const dependencies of lines) assert.ok(dependencies.includes('node24>=24.16.0:www/node24'));
            for (const dependencies of lines.slice(0, 2)) assert.ok(dependencies.includes('npm-node24>=0:www/npm-node24'));
            assert.deepEqual(lines[2], ['node24>=24.16.0:www/node24']);
            console.log('PASS make fetch/build/runtime package dependency admission');
            JS
            port_make package
            port_make check-plist stage-qa
            stage=$(port_make -V STAGEDIR)
            pkgfile=$(port_make -V PKGFILE)
            case "$stage" in "$root/work/"*) ;; *) echo 'stage escaped owned scratch' >&2; exit 1 ;; esac
            case "$pkgfile" in "$root/packages/"*) ;; *) echo 'package escaped owned scratch' >&2; exit 1 ;; esac
            [ -f "$pkgfile" ]
            pkg info --file "$pkgfile" --raw --raw-format json > "$root/package-full.json"
            node - "$stage" "$pkgfile" "$root/package-full.json" "$root/export" "$candidate" <<'JS'
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const assert = require('node:assert/strict');
            const {createRequire} = require('node:module');
            const {execFileSync} = require('node:child_process');
            const [stage, archive, manifestPath, output, candidate] = process.argv.slice(2);
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            assert.equal(manifest.name, 'openclaw-ai-gateway');
            assert.equal(manifest.version, '2026.9.4');
            assert.equal(manifest.origin, 'misc/openclaw');
            assert.equal(manifest.prefix, '/usr/local');
            assert.equal(manifest.deps.node24.origin, 'www/node24');
            assert.ok(['=', '>'].includes(execFileSync('pkg', ['version', '-t', manifest.deps.node24.version, '24.16.0'], {encoding: 'utf8'}).trim()));
            const runtime = path.join(stage, 'usr/local/lib/node_modules/openclaw');
            const req = createRequire(path.join(runtime, 'package.json'));
            const koffi = req('koffi');
            assert.equal(koffi.load(null).func('int getpid()')(), process.pid);
            assert.ok(req('tree-sitter-bash').language);
            const loaded = Object.keys(require.cache).filter(name => name.endsWith('.node')).map(name => path.relative(runtime, name)).sort();
            assert.deepEqual(loaded, ['node_modules/koffi/build/koffi/freebsd_x64/koffi.node', 'node_modules/tree-sitter-bash/prebuilds/freebsd-x64/tree-sitter-bash.node']);
            const members = execFileSync('tar', ['-tf', archive], {encoding: 'utf8', maxBuffer: 32 * 1024 * 1024}).trim().split('\n');
            const files = Object.keys(manifest.files);
            const required = ['usr/local/bin/openclaw', 'usr/local/etc/rc.d/openclaw', 'usr/local/lib/node_modules/openclaw/openclaw.mjs', ...loaded.map(name => 'usr/local/lib/node_modules/openclaw/' + name)];
            const hashes = {};
            for (const name of required) {
              assert.ok(files.some(file => file.replace(/^\/+/, '') === name), `missing manifest file ${name}`);
              const entries = members.filter(member => member.replace(/^\/+/, '') === name);
              assert.equal(entries.length, 1);
              const packed = execFileSync('tar', ['-xOf', archive, entries[0]], {maxBuffer: 32 * 1024 * 1024});
              const staged = fs.readFileSync(path.join(stage, name));
              assert.ok(packed.equals(staged), `package payload differs from stage: ${name}`);
              hashes[name] = crypto.createHash('sha256').update(packed).digest('hex');
            }
            const packagedAddons = files.filter(file => file.endsWith('.node')).map(file => file.replace(/^\/+/, '')).sort();
            assert.deepEqual(packagedAddons, loaded.map(name => 'usr/local/lib/node_modules/openclaw/' + name).sort());
            assert.ok(fs.statSync(path.join(stage, 'usr/local/bin/openclaw')).mode & 0o111);
            assert.ok(fs.readFileSync(path.join(stage, 'usr/local/bin/openclaw'), 'utf8').includes('exec /usr/local/lib/node_modules/openclaw/openclaw.mjs "$@"'));
            const version = execFileSync('node', [path.join(runtime, 'openclaw.mjs'), '--version'], {encoding: 'utf8', timeout: 60000}).trim();
            assert.match(version, /2026\.9\.4/);
            const packageInfo = Object.fromEntries(['name', 'version', 'origin', 'prefix', 'abi', 'arch', 'deps', 'options', 'shlibs_required'].filter(key => key in manifest).map(key => [key, manifest[key]]));
            fs.writeFileSync(path.join(output, 'package-info.json'), JSON.stringify(packageInfo, null, 2) + '\n');
            fs.writeFileSync(path.join(output, 'native-inventory.json'), JSON.stringify({node: process.version, loadedAddons: loaded, packagedAddons, hashes}, null, 2) + '\n');
            fs.writeFileSync(path.join(output, 'package-proof.json'), JSON.stringify({candidate, version, fileCount: files.length, packageBytes: fs.statSync(archive).size, packageSha256: crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex'), skillDependencies: false, stageAndPackage: 'passed', installAndUpgrade: 'not run'}, null, 2) + '\n');
            console.log('PASS real Ports package manifest, source-built addon payloads, loaders and staged CLI');
            JS
            [ ! -e /usr/local/bin/openclaw ]
            [ ! -e /usr/local/etc/rc.d/openclaw ]
            SH
            # The build and all descendants remain inside the same bounded scratch lifetime.
            timeout -k 15 2700 /bin/sh "$work/package.sh" "$work"
            size=$(du -sk "$work/scratch/export" | awk '{print $1}')
            [ "$size" -lt 1024 ]
            mkdir "$output"
            for name in package-info.json native-inventory.json package-proof.json; do
              cp "$work/scratch/export/$name" "$output/$name"
            done
            echo 'PASS Ports stage/package with optional skill dependencies disabled; no package install, service or upgrade claim'
            DRIVER
            test "$(sha256 -q "$driver")" = '30684acd07ae8b95f4af53662c1d306b4824e2a194fba781f20047710357a51b'
            sh "$driver" /tmp/openclaw-ports-export
      - name: Transfer only the three bounded proof files
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          # The VM action leaves its task-owned `freebsd` SSH alias available.
          remote = r"""
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const root = process.argv[2];
          const names = ['native-inventory.json', 'package-info.json', 'package-proof.json'];
          assert.ok(fs.lstatSync(root).isDirectory());
          assert.deepEqual(fs.readdirSync(root).sort(), names);
          const result = [];
          let total = 0;
          for (const name of names) {
            const fd = fs.openSync(root + '/' + name, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
            try {
              const stat = fs.fstatSync(fd);
              assert.ok(stat.isFile());
              total += stat.size;
              assert.ok(total < 1024 * 1024);
              const data = fs.readFileSync(fd);
              assert.equal(data.length, stat.size);
              result.push({name, size: data.length, sha256: crypto.createHash('sha256').update(data).digest('hex'), data: data.toString('base64')});
            } finally { fs.closeSync(fd); }
          }
          process.stdout.write(JSON.stringify(result));
          """
          transfer = subprocess.run(
              ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=15",
               "-o", "ServerAliveInterval=15", "-o", "ServerAliveCountMax=3",
               "freebsd", "/usr/local/bin/node", "-", "/tmp/openclaw-ports-export"],
              input=remote.encode(), stdout=subprocess.PIPE, check=True, timeout=60)
          assert len(transfer.stdout) < 1500000
          items = json.loads(transfer.stdout)
          expected = {"package-info.json", "package-proof.json", "native-inventory.json"}
          assert len(items) == 3 and {item["name"] for item in items} == expected
          payloads = {}
          for item in items:
              payload = base64.b64decode(item["data"], validate=True)
              assert len(payload) == item["size"]
              assert hashlib.sha256(payload).hexdigest() == item["sha256"]
              payloads[item["name"]] = payload
          assert sum(map(len, payloads.values())) < 1024 * 1024
          root = Path("freebsd-port-package-proof")
          root.mkdir()
          for name, payload in sorted(payloads.items()):
              with (root / name).open("xb") as output:
                  output.write(payload)
              print(f"EXPORT {name} bytes={len(payload)} sha256={hashlib.sha256(payload).hexdigest()}")
      - name: Retain only the three package proof receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freebsd-port-package-${{ github.run_id }}
          path: |
            freebsd-port-package-proof/package-info.json
            freebsd-port-package-proof/package-proof.json
            freebsd-port-package-proof/native-inventory.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false
