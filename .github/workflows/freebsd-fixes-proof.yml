name: Temporary FreeBSD fixes proof

on:
  push:
    branches: [proof/freebsd-fixes]
    paths: [.github/workflows/freebsd-fixes-proof.yml]

permissions:
  contents: read

concurrency:
  group: temporary-freebsd-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freebsd:
    if: github.repository == 'vincentkoc/plugins-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vincentkoc/auto-launch
          ref: cd52eaa3ac2a045a42af8bc24dcc636def861fcc
          persist-credentials: false
      - name: Verify candidate source
        run: test "$(git rev-parse HEAD)" = 'cd52eaa3ac2a045a42af8bc24dcc636def861fcc'
      - name: Test on native FreeBSD
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y rust git glib
          run: |
            set -eu
            test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 'cd52eaa3ac2a045a42af8bc24dcc636def861fcc'
            freebsd-version
            rustc --version
            cargo --version
            gio version
            sha256 -q Cargo.lock
            timeout -k 15s 300s cargo test --locked --lib --test xdg_exec
